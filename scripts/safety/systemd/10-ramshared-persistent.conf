# File: scripts/safety/systemd/10-ramshared-persistent.conf
# Keep the journal persistent so postmortem collection can inspect the previous
# boot after an abrupt WSL restart. Install as
# /etc/systemd/journald.conf.d/10-ramshared-persistent.conf.
[Journal]
Storage=persistent
SystemMaxUse=500M
