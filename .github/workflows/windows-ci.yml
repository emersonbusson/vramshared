name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-ci.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/windows/**'
  pull_request:
    paths:
      - '.github/workflows/windows-ci.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/windows/**'

permissions: {}

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows runtime tests and static fixtures
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain (Rust 1.100.0)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0

      - name: Native Rust tests
        run: cargo test --locked -p ramshared-winbroker -p ramshared-winsvc -- --test-threads=1

      - name: Static Windows fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/windows/Test-SharedWslPressureOutcome.ps1
          & scripts/windows/Test-SharedWslPressureCampaignStatic.ps1
          & scripts/windows/Test-RootDeviceStatic.ps1 -RepoRoot $env:GITHUB_WORKSPACE
