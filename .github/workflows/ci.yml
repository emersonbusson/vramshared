name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain (Rust 1.100.0 + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace -- --test-threads=1

  guest-safety:
    name: guest safety scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Shell syntax checks
        run: |
          set -euo pipefail
          for script in \
            scripts/safety/cascade-pressure-probe.sh \
            scripts/safety/guest-pressure-runtime-guard.sh \
            scripts/safety/ramshared-guest-memory-admission.sh \
            scripts/safety/release-identity.sh \
            scripts/safety/auto-update.sh \
            scripts/install-release.sh \
            scripts/package/package-payload-manifest.sh \
            scripts/package/build-linux-bundle.sh \
            scripts/package/build-deb-package.sh \
            scripts/package/build-rpm-package.sh \
            scripts/package/render-release-notes.sh \
            scripts/package/test-render-release-notes.sh \
            scripts/kernel/build-wsl-kernel.sh; do
            bash -n "$script"
          done

      - name: Safety & release ordering fixtures
        run: |
          set -euo pipefail
          ./scripts/ci/check-kernel-checkpatch.sh --provision
          bash scripts/ci/test-kernel-gate-flags.sh
          bash scripts/ci/test-kernel-gate-honesty.sh
          bash scripts/package/test-render-release-notes.sh
          bash scripts/safety/test-guest-pressure-runtime-guard.sh
          bash scripts/safety/test-cascade-pressure-probe-static.sh
          bash scripts/safety/test-ramshared-guest-memory-admission.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/safety/test_managed_pressure_scope.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/safety/test_pressure_control_ready.py
