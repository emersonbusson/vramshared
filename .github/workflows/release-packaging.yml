name: Release Packaging & Distribution

on:
  push:
    tags:
      - 'v[1-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build Distro Packages (Ubuntu, Fedora, Arch, Bundle)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev binutils build-essential

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.100.0

      - name: Build Release Binaries
        run: cargo build --release --locked -p ramshared-cli -p ramshared-wsl2d

      - name: Build Sealed Linux Bundle (.tar.gz)
        env:
          RAMSHARED_PACKAGE_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || 'v1.0.0' }}
        run: ./scripts/package/build-linux-bundle.sh --skip-build

      - name: Build Debian/Ubuntu Package (.deb)
        run: ./scripts/package/build-deb-package.sh "${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || 'v1.0.0' }}"

      - name: Build Fedora/RHEL Package (.rpm)
        run: ./scripts/package/build-rpm-package.sh "${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || 'v1.0.0' }}"

      - name: Package Arch Linux PKGBUILD Tarball
        run: |
          tar -czf artifacts/packages/ramshared-arch.tar.gz \
            packaging/arch/PKGBUILD \
            packaging/arch/ramshared.install \
            packaging/systemd/65-ramshared-observability.rules

      - name: Generate Checksums
        working-directory: artifacts/packages
        run: |
          find . -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-packages
          path: artifacts/packages/

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version || 'v1.0.0' }}"
          find artifacts/packages -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "SHA256SUMS.txt" \) -exec gh release upload "$TARGET_TAG" --clobber {} +
