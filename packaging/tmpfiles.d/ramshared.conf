# File: packaging/tmpfiles.d/ramshared.conf
# The product runtime directory is root-owned product state: the lifecycle
# binding, the zram/NBD records, the pid file and the control socket all live
# here, and the transition-lock custody refuses a lock root that is not owned
# by the effective user (root) or that carries group/world write. Declaring
# this directory as the `ramshared` user made every root mutation (`up`,
# `down`, `ensure-origin`) refuse itself right after a boot.
d /run/ramshared 0700 root root - -
