# RamShared Kernel Performance & Hyper-V Anti-Freeze Tuning
# Eliminates direct reclaim vCPU stalls and accelerates tiered swap migrations

vm.min_free_kbytes = 524288
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.page_lock_unfairness = 1
