# File: crates/ramshared-winsvc/Cargo.toml
[package]
name = "ramshared-winsvc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows userspace service for StorPort CUDA VRAM disk (SPEC windows-storport-cuda-vram)"

[[bin]]
name = "ramshared-winsvc"
path = "src/main.rs"

[lib]
name = "ramshared_winsvc"
path = "src/lib.rs"

[dependencies]
ramshared-block = { path = "../ramshared-block" }
ramshared-broker = { path = "../ramshared-broker" }
ramshared-ipc = { path = "../ramshared-ipc" }
ramshared-winbroker = { path = "../ramshared-winbroker" }
ramshared-vram = { path = "../ramshared-vram" }
# Product CUDA path (probe + runtime); pure planning helpers are usable on all hosts.
ramshared-cuda = { path = "../ramshared-cuda" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_HostComputeSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_Security_Cryptography",
    "Win32_System_WindowsProgramming",
] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
